# TPSBasedMobSpawner Configuration
# This plugin increases mob spawning around players based on TPS

settings:
  # Minimum TPS required for mob spawning (default: 19)
  min_tps: 19
  
  # Maximum mobs allowed per world (default: 100)
  max_mobs_per_world: 100
  
  # Radius around players to spawn mobs (default: 50 blocks)
  spawn_radius: 50
  
  # Minimum distance from players to spawn mobs (default: 20 blocks)
  min_spawn_distance: 20
  
  # How often to check for spawning (in ticks, 20 = 1 second)
  spawn_check_interval: 20
  
  # How often to check TPS (in ticks, 20 = 1 second)
  tps_check_interval: 20
  
  # Enable LevelledMobs integration (default: true)
  enable_levelledmobs: true
  
  # Prefix for LevelledMobs names (default: [Lv])
  levelledmobs_prefix: "&7[&b&lLv&7]"
  
  # Enable grief prevention land protection check (default: true)
  enable_grief_prevention_check: true
  
  # Allow mobs to damage players (default: true)
  allow_mob_damage: true
  
  # Allow mobs to target players (default: true)
  allow_mob_targeting: true
  
  # Enable base protection to prevent mob spawning near player structures (default: true)
  enable_base_protection: true

# Worlds where mob spawning is disabled
blacklisted_worlds:
  - "world_nether"
  - "world_the_end"
  - "creative_world"
  - "minigame_world"

